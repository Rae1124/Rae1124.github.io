<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#12376b" />
  <title>Student ID Replacement & Issuance System</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f7fc}button,input,select{font:inherit}button{cursor:pointer}.page{min-height:100vh;display:grid;grid-template-columns:1.06fr .94fr}.hero{background:linear-gradient(145deg,#0d2850,#1f5b9b);color:#fff;padding:8vh 7vw;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:460px;height:460px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-180px;bottom:-140px;box-shadow:0 0 0 75px rgba(255,255,255,.03),0 0 0 150px rgba(255,255,255,.02)}.seal{width:64px;height:64px;border-radius:16px;background:#fff;color:#173b73;display:grid;place-items:center;font-size:30px;margin-bottom:28px;box-shadow:0 12px 30px rgba(0,0,0,.15)}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800;color:#3970b8}.hero .eyebrow{color:#c5dcfb}.hero h1{font-size:42px;line-height:1.12;margin:12px 0 18px;max-width:680px}.hero>p{max-width:570px;color:#d6e4f5;line-height:1.7;font-size:14px}.points{display:grid;gap:11px;margin-top:23px}.points span{display:flex;gap:10px;align-items:center;font-size:12px;color:#edf5ff}.check{width:19px;height:19px;border:1px solid rgba(255,255,255,.75);border-radius:50%;display:grid;place-items:center;font-size:11px}.panelWrap{display:grid;place-items:center;padding:36px}.card{width:min(510px,100%);background:#fff;border:1px solid #e0e7f0;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(24,52,86,.09)}.card h2{font-size:27px;margin:7px 0 6px}.muted{font-size:12px;color:#7d8998;line-height:1.6}.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:21px 0}.role{display:grid;grid-template-columns:38px 1fr 20px;grid-template-rows:auto auto;align-items:center;column-gap:10px;background:#f9fbfd;border:1px solid #dde6f0;border-radius:12px;padding:14px;color:#334e6d;text-align:left}.role:hover{background:#f1f7ff;border-color:#76a3d4}.role .icon{grid-row:1/3;width:34px;height:34px;border-radius:9px;background:#e9f2fd;color:#2b68aa;display:grid;place-items:center}.role b{font-size:12px}.role small{font-size:9px;color:#8491a2;margin-top:2px}.arrow{grid-row:1/3;grid-column:3;color:#5e7390}.notice{margin-top:16px;padding:12px 13px;border-radius:10px;border:1px solid #d6e6f8;background:#f2f7fe;color:#4e6380;font-size:10px;line-height:1.55}.notice strong{display:block;color:#245b98;margin-bottom:3px}.back{border:0;background:transparent;color:#2f65a4;padding:0 0 15px;font-size:11px;font-weight:700}.form{display:grid;gap:13px;margin-top:18px}.form label{display:grid;gap:6px;font-size:11px;font-weight:700;color:#506078}.form input,.form select{width:100%;border:1px solid #d8e0ea;border-radius:9px;padding:11px 12px;outline:none;background:#fff}.form input:focus,.form select:focus{border-color:#6e9ed3;box-shadow:0 0 0 3px #edf5ff}.remember{display:flex!important;align-items:center;gap:8px!important;font-weight:500!important}.remember input{width:auto;padding:0}.primary{border:0;border-radius:9px;background:#2563a8;color:#fff;padding:12px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary:hover{background:#1d4f87}.secondary{border:1px solid #ccdaeb;border-radius:9px;background:#fff;color:#24548c;padding:11px 14px;font-weight:700}.wide{width:100%}.links{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.links button{border:0;background:transparent;color:#2b66a6;padding:0;font-size:10px;font-weight:800}.status{margin:13px 0 0;border:1px solid #f3d6a3;background:#fff8e9;color:#805c16;border-radius:10px;padding:11px 12px;font-size:10px;line-height:1.5}.registerGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.success{border:1px solid #cfead9;background:#eef9f2;color:#2b6f43;border-radius:10px;padding:11px 12px;font-size:10px;line-height:1.5}.footer{margin-top:18px;padding-top:14px;border-top:1px solid #edf0f4;color:#9aa3ae;font-size:9px;text-align:center}.hidden{display:none!important}@media(max-width:960px){.page{grid-template-columns:1fr}.hero{display:none}.panelWrap{min-height:100vh;padding:20px}}@media(max-width:560px){.card{padding:22px}.rolegrid,.registerGrid{grid-template-columns:1fr}.full{grid-column:auto}.links{display:grid}.card h2{font-size:24px}}
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="seal">🎓</div>
      <span class="eyebrow">ONLINE STUDENT SERVICES</span>
      <h1>Student ID Replacement<br>& Issuance System</h1>
      <p>Fast, convenient, and secure online ID replacement processing for students and authorized school personnel.</p>
      <div class="points">
        <span><i class="check">✓</i> School-managed user accounts</span>
        <span><i class="check">✓</i> Role-based access control</span>
        <span><i class="check">✓</i> Online application and status tracking</span>
      </div>
    </section>
    <main class="panelWrap">
      <div class="card" id="card"></div>
    </main>
  </div>
<script>
const state={mode:'portals',role:null};
const API_BASE='';
const courses=['Bachelor of Science in Information Technology','Bachelor of Science in Computer Science','Bachelor of Science in Information Systems','Bachelor of Science in Entertainment and Multimedia Computing'];
const years=['1st Year','2nd Year','3rd Year','4th Year'];
const card=document.getElementById('card');
const roleLabel=r=>r==='student'?'Student':r==='registrar'?'Registrar':r==='idoffice'?'ID Office':'Administrator';
const icon=r=>r==='student'?'👤':r==='registrar'?'🏢':r==='idoffice'?'💳':'🛡️';
function backendMessage(){return `<div class="status"><strong>Frontend is live on GitHub Pages.</strong>The secure backend is not connected yet. Login, registration, uploads, and database actions will be enabled after we migrate the API to a free backend host.</div>`}
function render(){
 if(state.mode==='portals') return renderPortals();
 if(state.mode==='login') return renderLogin();
 if(state.mode==='register') return renderRegister();
 if(state.mode==='forgot') return renderForgot();
}
function renderPortals(){card.innerHTML=`<span class="eyebrow">SECURE SCHOOL LOGIN</span><h2>Choose your portal</h2><p class="muted">Select your assigned account type. Your role will be verified by the school system when the backend is connected.</p><div class="rolegrid">${[['student','Apply and track requests'],['registrar','Review applications'],['idoffice','Process replacement IDs'],['admin','Manage users and system']].map(([r,s])=>`<button class="role" data-role="${r}"><span class="icon">${icon(r)}</span><b>${roleLabel(r)}</b><small>${s}</small><span class="arrow">›</span></button>`).join('')}</div>${backendMessage()}<div class="notice"><strong>GitHub Pages deployment</strong>This page is served from Rae1124.github.io, so it has no AppDeploy floating toolbar.</div><div class="footer">Online Students ID Replacement & Issuance System</div>`;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.mode='login';render()})}
function renderLogin(){const student=state.role==='student';card.innerHTML=`<button class="back" id="back">← Back to portals</button><span class="eyebrow">${roleLabel(state.role).toUpperCase()} PORTAL</span><h2>${roleLabel(state.role)} Login</h2><p class="muted">${student?'Use your Student ID or school email and your password.':'Use the username or email issued for your staff account.'}</p><form class="form" id="loginForm"><label>${student?'Student ID or School Email':'Username or Email'}<input autocomplete="username" required placeholder="${student?'2026-0000 or name@school.edu.ph':'username or staff@school.edu.ph'}"></label><label>Password<input type="password" autocomplete="current-password" required placeholder="Enter your password"></label><label class="remember"><input type="checkbox"> Remember me on this device</label>${backendMessage()}<button class="primary wide" type="submit">Login</button></form>${student?`<div class="links"><button id="register">Create Student Profile</button><button id="forgot">Forgot Password?</button></div>`:''}<div class="footer">Portal selection never grants permissions by itself.</div>`;document.getElementById('back').onclick=()=>{state.mode='portals';render()};if(student){document.getElementById('register').onclick=()=>{state.mode='register';render()};document.getElementById('forgot').onclick=()=>{state.mode='forgot';render()}}document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();alert('The GitHub Pages frontend is ready, but the secure backend has not been connected yet. We will enable login after the backend migration.')}}
function renderRegister(){card.innerHTML=`<button class="back" id="back">← Back to Student Login</button><span class="eyebrow">STUDENT REGISTRATION</span><h2>Create Student Profile</h2><p class="muted">This is the approved registration layout. Saving will be enabled once the backend is connected.</p><form class="form" id="regForm"><div class="registerGrid"><label>Student ID<input required placeholder="2026-0000"></label><label>First Name<input required></label><label>Middle Name<input></label><label>Last Name<input required></label><label>School Email<input type="email" required placeholder="student@school.edu.ph"></label><label>Contact Number<input></label><label class="full">Address<input></label><label>Course / Program<select>${courses.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Year Level<select>${years.map(y=>`<option>${y}</option>`).join('')}</select></label><label>Section<input required placeholder="BSIT 1-09"></label><label>Password<input type="password" required></label><label>Confirm Password<input type="password" required></label></div>${backendMessage()}<button class="primary wide" type="submit">Create Student Profile</button></form>`;document.getElementById('back').onclick=()=>{state.mode='login';render()};document.getElementById('regForm').onsubmit=e=>{e.preventDefault();alert('Registration is not saving yet because the backend is still being migrated. No information was submitted.')}}
function renderForgot(){card.innerHTML=`<button class="back" id="back">← Back to Student Login</button><span class="eyebrow">ACCOUNT RECOVERY</span><h2>Forgot Password</h2><p class="muted">Enter your Student ID or registered school email.</p><form class="form" id="forgotForm"><label>Student ID or School Email<input required></label>${backendMessage()}<button class="primary wide" type="submit">Send Reset Code</button></form>`;document.getElementById('back').onclick=()=>{state.mode='login';render()};document.getElementById('forgotForm').onsubmit=e=>{e.preventDefault();alert('Password recovery will be enabled after the backend and email service are connected.')};}
render();
</script>
</body>
</html>
