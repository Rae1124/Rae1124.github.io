<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://rpaaagfgyauqeyrqollr.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="theme-color" content="#12376b" />
    <title>Student ID Replacement & Issuance System</title>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #f3f7fc;
        color: #172033;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      .page {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
      }
      .hero {
        background: linear-gradient(145deg, #0d2850, #1f5b9b);
        color: #fff;
        padding: 8vh 7vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .seal {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #fff;
        color: #173b73;
        display: grid;
        place-items: center;
        font-size: 30px;
        margin-bottom: 28px;
      }
      .eyebrow {
        display: block;
        font-size: 11px;
        letter-spacing: 0.15em;
        font-weight: 800;
        color: #3970b8;
        line-height: 1.3;
      }
      .hero .eyebrow {
        color: #c5dcfb;
      }
      .hero h1 {
        font-size: 42px;
        line-height: 1.12;
        margin: 12px 0 18px;
      }
      .hero p {
        color: #d6e4f5;
        line-height: 1.7;
        font-size: 14px;
        max-width: 600px;
      }
      .points {
        display: grid;
        gap: 11px;
        margin-top: 23px;
      }
      .points span {
        font-size: 12px;
      }
      .panelWrap {
        display: grid;
        place-items: center;
        padding: 34px;
      }
      .card {
        width: min(580px, 100%);
        background: #fff;
        border: 1px solid #e0e7f0;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 18px 50px rgba(24, 52, 86, 0.09);
      }
      .card h2 {
        font-size: 27px;
        line-height: 1.2;
        margin: 8px 0;
      }
      .muted {
        font-size: 12px;
        color: #7d8998;
        line-height: 1.65;
      }
      .authHead {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 4px;
      }
      .back {
        display: block;
        border: 0;
        background: transparent;
        color: #2f65a4;
        padding: 0;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.3;
        cursor: pointer;
      }
      .rolegrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
        margin: 21px 0;
      }
      .role {
        display: grid;
        grid-template-columns: 38px 1fr 20px;
        align-items: center;
        column-gap: 10px;
        background: #f9fbfd;
        border: 1px solid #dde6f0;
        border-radius: 12px;
        padding: 14px;
        color: #334e6d;
        text-align: left;
        cursor: pointer;
      }
      .role:hover {
        background: #f1f7ff;
        border-color: #76a3d4;
      }
      .role .icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: #e9f2fd;
        color: #2b68aa;
        display: grid;
        place-items: center;
      }
      .role b {
        display: block;
        font-size: 12px;
        line-height: 1.35;
      }
      .role small {
        display: block;
        font-size: 9px;
        line-height: 1.4;
        color: #8491a2;
        margin-top: 2px;
      }
      .form {
        display: grid;
        gap: 13px;
        margin-top: 18px;
      }
      .form label {
        display: grid;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.4;
        color: #506078;
      }
      .form input,
      .form select,
      .form textarea {
        width: 100%;
        border: 1px solid #d8e0ea;
        border-radius: 9px;
        padding: 11px 12px;
        outline: none;
        background: #fff;
      }
      .form textarea {
        min-height: 90px;
        resize: vertical;
      }
      .remember {
        display: flex !important;
        align-items: center;
        gap: 8px !important;
        font-weight: 500 !important;
      }
      .remember input {
        width: auto;
      }
      .primary,
      .outline,
      .danger {
        border-radius: 9px;
        padding: 11px 14px;
        font-weight: 800;
        line-height: 1.2;
        cursor: pointer;
      }
      .primary {
        border: 0;
        background: #2563a8;
        color: #fff;
      }
      .primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .outline {
        border: 1px solid #cfdbea;
        background: #fff;
        color: #24548c;
      }
      .danger {
        border: 1px solid #efcaca;
        background: #fff5f5;
        color: #a43b3b;
      }
      .wide {
        width: 100%;
      }
      .links {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
      }
      .links button {
        border: 0;
        background: transparent;
        color: #2b66a6;
        padding: 0;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
      }
      .full {
        grid-column: 1/-1;
      }
      .msg {
        padding: 10px 11px;
        border-radius: 9px;
        font-size: 10px;
        line-height: 1.45;
      }
      .error {
        border: 1px solid #f1c2c2;
        background: #fff2f2;
        color: #a23838;
      }
      .success {
        border: 1px solid #cfead9;
        background: #eef9f2;
        color: #2b6f43;
      }
      .footer {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #edf0f4;
        color: #9aa3ae;
        font-size: 9px;
        text-align: center;
        line-height: 1.4;
      }
      .captchaBlock {
        border: 1px solid #dfe7f0;
        border-radius: 12px;
        background: #f8fbfe;
        padding: 12px;
        display: grid;
        gap: 8px;
      }
      .captchaLabel {
        font-size: 11px;
        font-weight: 800;
        color: #506078;
      }
      .captchaHint {
        font-size: 10px;
        color: #7d8998;
        line-height: 1.4;
      }
      .turnstileWrap {
        min-height: 65px;
        display: flex;
        align-items: center;
      }
      .app {
        min-height: 100vh;
        background: #eef4fa;
      }
      .topbar {
        background: #12376b;
        color: #fff;
        padding: 16px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .topbar h1 {
        font-size: 18px;
        line-height: 1.25;
        margin: 0;
      }
      .topbar small {
        display: block;
        color: #d7e5f6;
        margin-top: 4px;
        line-height: 1.4;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: calc(100vh - 70px);
      }
      .side {
        background: #fff;
        border-right: 1px solid #dde6f0;
        padding: 18px;
      }
      .side button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 11px 10px;
        border-radius: 8px;
        color: #43566d;
        cursor: pointer;
        line-height: 1.35;
      }
      .side button:hover,
      .side button.active {
        background: #edf5ff;
        color: #235f9e;
      }
      .content {
        padding: 24px;
      }
      .content h2 {
        line-height: 1.25;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 16px 0;
      }
      .stat,
      .panel {
        background: #fff;
        border: 1px solid #dfe7f0;
        border-radius: 14px;
        padding: 16px;
      }
      .stat span {
        display: block;
        font-size: 11px;
        line-height: 1.4;
        color: #65758a;
      }
      .stat b {
        font-size: 24px;
        line-height: 1.25;
        display: block;
        margin-top: 4px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .table th,
      .table td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #edf1f5;
        vertical-align: top;
        line-height: 1.45;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: #eef4fa;
        font-size: 10px;
        line-height: 1.25;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sectionHead {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 24, 42, 0.45);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 10;
      }
      .modalBox {
        width: min(720px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: #fff;
        border-radius: 16px;
        padding: 22px;
      }
      .docList {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }
      .docItem {
        border: 1px solid #dfe7f0;
        border-radius: 12px;
        padding: 13px;
        background: #fbfdff;
      }
      .docTop {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .docName {
        font-size: 12px;
        font-weight: 800;
        line-height: 1.4;
        word-break: break-word;
      }
      .docMeta {
        font-size: 10px;
        color: #7d8998;
        line-height: 1.5;
        margin-top: 4px;
      }
      .docStatus {
        font-size: 10px;
        font-weight: 800;
      }
      .profileGrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .profileGrid div {
        background: #f8fbfe;
        border: 1px solid #e3ebf3;
        border-radius: 9px;
        padding: 10px;
      }
      .profileGrid span {
        display: block;
        color: #7d8998;
        font-size: 10px;
      }
      .profileGrid b {
        font-size: 12px;
        line-height: 1.4;
      }
      @media (max-width: 900px) {
        .page {
          grid-template-columns: 1fr;
        }
        .hero {
          display: none;
        }
        .panelWrap {
          min-height: 100vh;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .side {
          display: flex;
          overflow: auto;
          border-right: 0;
          border-bottom: 1px solid #dde6f0;
        }
        .side button {
          min-width: max-content;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 560px) {
        .card {
          padding: 22px;
        }
        .rolegrid,
        .grid2,
        .profileGrid {
          grid-template-columns: 1fr;
        }
        .full {
          grid-column: auto;
        }
        .content {
          padding: 14px;
        }
        .stats {
          grid-template-columns: 1fr;
        }
        .table {
          font-size: 10px;
        }
        .sectionHead,
        .docTop {
          align-items: stretch;
          flex-direction: column;
        }
        .links {
          gap: 18px;
        }
      }
    </style>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="app.js?v=1.1.2"></script>
    <script src="ui-enhance.js"></script>
  </body>
</html>
