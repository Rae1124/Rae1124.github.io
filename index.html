<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12376b"><title>Student ID Replacement & Issuance System</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f7fc;color:#172033}button,input,select,textarea{font:inherit}.page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.hero{background:linear-gradient(145deg,#0d2850,#1f5b9b);color:#fff;padding:8vh 7vw;display:flex;flex-direction:column;justify-content:center}.seal{width:64px;height:64px;border-radius:16px;background:#fff;color:#173b73;display:grid;place-items:center;font-size:30px;margin-bottom:28px}.eyebrow{display:block;font-size:11px;letter-spacing:.15em;font-weight:800;color:#3970b8;line-height:1.3}.hero .eyebrow{color:#c5dcfb}.hero h1{font-size:42px;line-height:1.12;margin:12px 0 18px}.hero p{color:#d6e4f5;line-height:1.7;font-size:14px;max-width:600px}.points{display:grid;gap:11px;margin-top:23px}.points span{font-size:12px}.panelWrap{display:grid;place-items:center;padding:34px}.card{width:min(580px,100%);background:#fff;border:1px solid #e0e7f0;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(24,52,86,.09)}.card h2{font-size:27px;line-height:1.2;margin:8px 0 8px}.muted{font-size:12px;color:#7d8998;line-height:1.65}.authHead{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:4px}.authHead .back{margin:0}.back{display:block;border:0;background:transparent;color:#2f65a4;padding:0;font-size:11px;font-weight:700;line-height:1.3;cursor:pointer}.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:21px 0}.role{display:grid;grid-template-columns:38px 1fr 20px;align-items:center;column-gap:10px;background:#f9fbfd;border:1px solid #dde6f0;border-radius:12px;padding:14px;color:#334e6d;text-align:left;cursor:pointer}.role:hover{background:#f1f7ff;border-color:#76a3d4}.role .icon{width:34px;height:34px;border-radius:9px;background:#e9f2fd;color:#2b68aa;display:grid;place-items:center}.role b{display:block;font-size:12px;line-height:1.35}.role small{display:block;font-size:9px;line-height:1.4;color:#8491a2;margin-top:2px}.form{display:grid;gap:13px;margin-top:18px}.form label{display:grid;gap:6px;font-size:11px;font-weight:700;line-height:1.4;color:#506078}.form input,.form select,.form textarea{width:100%;border:1px solid #d8e0ea;border-radius:9px;padding:11px 12px;outline:none;background:#fff}.form textarea{min-height:90px;resize:vertical}.remember{display:flex!important;align-items:center;gap:8px!important;font-weight:500!important}.remember input{width:auto}.primary,.outline,.danger{border-radius:9px;padding:11px 14px;font-weight:800;line-height:1.2;cursor:pointer}.primary{border:0;background:#2563a8;color:#fff}.outline{border:1px solid #cfdbea;background:#fff;color:#24548c}.danger{border:1px solid #efcaca;background:#fff5f5;color:#a43b3b}.wide{width:100%}.links{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.links button{border:0;background:transparent;color:#2b66a6;padding:0;font-size:10px;font-weight:800;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.msg{padding:10px 11px;border-radius:9px;font-size:10px;line-height:1.45}.error{border:1px solid #f1c2c2;background:#fff2f2;color:#a23838}.success{border:1px solid #cfead9;background:#eef9f2;color:#2b6f43}.footer{margin-top:18px;padding-top:14px;border-top:1px solid #edf0f4;color:#9aa3ae;font-size:9px;text-align:center;line-height:1.4}.app{min-height:100vh;background:#eef4fa}.topbar{background:#12376b;color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar h1{font-size:18px;line-height:1.25;margin:0}.topbar small{display:block;color:#d7e5f6;margin-top:4px;line-height:1.4}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}.side{background:#fff;border-right:1px solid #dde6f0;padding:18px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 10px;border-radius:8px;color:#43566d;cursor:pointer;line-height:1.35}.side button:hover,.side button.active{background:#edf5ff;color:#235f9e}.content{padding:24px}.content h2{line-height:1.25}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat,.panel{background:#fff;border:1px solid #dfe7f0;border-radius:14px;padding:16px}.stat span{display:block;font-size:11px;line-height:1.4;color:#65758a}.stat b{font-size:24px;line-height:1.25;display:block;margin-top:4px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf1f5;vertical-align:top;line-height:1.45}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4fa;font-size:10px;line-height:1.25}.actions{display:flex;flex-wrap:wrap;gap:6px}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.modal{position:fixed;inset:0;background:rgba(10,24,42,.45);display:grid;place-items:center;padding:20px;z-index:10}.modalBox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.docList{display:grid;gap:10px;margin-top:14px}.docItem{border:1px solid #dfe7f0;border-radius:12px;padding:13px;background:#fbfdff}.docTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.docName{font-size:12px;font-weight:800;line-height:1.4;word-break:break-word}.docMeta{font-size:10px;color:#7d8998;line-height:1.5;margin-top:4px}.docStatus{font-size:10px;font-weight:800}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profileGrid div{background:#f8fbfe;border:1px solid #e3ebf3;border-radius:9px;padding:10px}.profileGrid span{display:block;color:#7d8998;font-size:10px}.profileGrid b{font-size:12px;line-height:1.4}@media(max-width:900px){.page{grid-template-columns:1fr}.hero{display:none}.panelWrap{min-height:100vh}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #dde6f0}.side button{min-width:max-content}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){.card{padding:22px}.rolegrid,.grid2,.profileGrid{grid-template-columns:1fr}.full{grid-column:auto}.content{padding:14px}.stats{grid-template-columns:1fr}.table{font-size:10px}.sectionHead,.docTop{align-items:stretch;flex-direction:column}.links{gap:18px}}</style></head><body><div id="root"></div><script>
const API='https://rpaaagfgyauqeyrqollr.supabase.co/functions/v1/id-system-api';
const DOC_API='https://rpaaagfgyauqeyrqollr.supabase.co/functions/v1/id-system-documents';
const S={role:null,user:null,token:localStorage.getItem('idrs_token')||sessionStorage.getItem('idrs_token')||'',view:'Dashboard'};const root=document.getElementById('root');
const courses=['Bachelor of Science in Information Technology','Bachelor of Science in Computer Science','Bachelor of Science in Information Systems','Bachelor of Science in Entertainment and Multimedia Computing'];const years=['1st Year','2nd Year','3rd Year','4th Year'];
const roleLabel=r=>r==='student'?'Student':r==='registrar'?'Registrar':r==='idoffice'?'ID Office':'Administrator';const icon=r=>r==='student'?'👤':r==='registrar'?'🏢':r==='idoffice'?'💳':'🛡️';
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function docApi(query='',opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;const r=await fetch(DOC_API+query,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Document request failed');return d}
function saveToken(t,remember){S.token=t;(remember?localStorage:sessionStorage).setItem('idrs_token',t);(remember?sessionStorage:localStorage).removeItem('idrs_token')}
function clearToken(){S.token='';S.user=null;localStorage.removeItem('idrs_token');sessionStorage.removeItem('idrs_token')}
function loginShell(inner){root.innerHTML=`<div class="page"><section class="hero"><div class="seal">🎓</div><span class="eyebrow">ONLINE STUDENT SERVICES</span><h1>Student ID Replacement<br>& Issuance System</h1><p>Fast, convenient, and secure online ID replacement processing for students and authorized school personnel.</p><div class="points"><span>✓ School-managed user accounts</span><span>✓ Role-based access control</span><span>✓ Online application and status tracking</span></div></section><main class="panelWrap"><div class="card">${inner}</div></main></div>`}
function authHead(backText,label){return `<div class="authHead"><button class="back" id="back">← ${backText}</button><span class="eyebrow">${label}</span></div>`}
function portals(){loginShell(`<span class="eyebrow">SECURE SCHOOL LOGIN</span><h2>Choose your portal</h2><p class="muted">Select the portal assigned to your account.</p><div class="rolegrid">${[['student','Apply and track requests'],['registrar','Review applications'],['idoffice','Process replacement IDs'],['admin','Manage users and system']].map(([r,s])=>`<button class="role" data-role="${r}"><span class="icon">${icon(r)}</span><span><b>${roleLabel(r)}</b><small>${s}</small></span><span>›</span></button>`).join('')}</div><div class="footer">Online Students ID Replacement & Issuance System</div>`);document.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{S.role=b.dataset.role;if(S.role==='admin'){try{const x=await api('/auth/setup-status');if(!x.adminExists)return adminSetup()}catch{}}login()})}
function login(msg=''){const student=S.role==='student';loginShell(`${authHead('Back to portals',roleLabel(S.role).toUpperCase()+' PORTAL')}<h2>${roleLabel(S.role)} Login</h2><p class="muted">${student?'Use your Student ID or school email and your password.':'Use the username or email issued for your staff account.'}</p><form class="form" id="f"><label>${student?'Student ID or School Email':'Username or Email'}<input id="id" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><label class="remember"><input id="rem" type="checkbox"> Remember me on this device</label><div id="m">${msg?`<div class="msg success">${msg}</div>`:''}</div><button class="primary wide">Login</button></form>${student?`<div class="links"><button id="reg">Create Student Profile</button><button id="forgot">Forgot Password?</button></div>`:''}`);back.onclick=portals;if(student){reg.onclick=register;forgot.onclick=()=>alert('If email recovery is unavailable, ask an Administrator to reset your password.')}f.onsubmit=async e=>{e.preventDefault();m.innerHTML='';try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({portal:S.role,identifier:id.value,password:pw.value,remember:rem.checked})});saveToken(d.token,rem.checked);S.user=d.user;S.view='Dashboard';app()}catch(e){m.innerHTML=`<div class="msg error">${e.message}</div>`}}}
function register(){loginShell(`${authHead('Back to Student Login','STUDENT REGISTRATION')}<h2>Create Student Profile</h2><p class="muted">Create your school-system account to apply for and track an ID replacement.</p><form class="form" id="f"><div class="grid2"><label>Student ID<input id="sid" required></label><label>First Name<input id="fn" required></label><label>Middle Name<input id="mn"></label><label>Last Name<input id="ln" required></label><label>School Email<input id="em" type="email" required></label><label>Contact Number<input id="ct"></label><label class="full">Address<input id="ad"></label><label>Course / Program<select id="pr">${courses.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Year Level<select id="yr">${years.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Section<input id="sc" required></label><label>Password<input id="pw" type="password" required></label><label>Confirm Password<input id="cp" type="password" required></label></div><div id="m"></div><button class="primary wide">Create Student Profile</button></form>`);back.onclick=()=>{S.role='student';login()};f.onsubmit=async e=>{e.preventDefault();if(pw.value!==cp.value)return m.innerHTML='<div class="msg error">Passwords do not match.</div>';try{await api('/auth/register-student',{method:'POST',body:JSON.stringify({studentId:sid.value,firstName:fn.value,middleName:mn.value,lastName:ln.value,email:em.value,contactNumber:ct.value,address:ad.value,password:pw.value,program:pr.value,yearLevel:yr.value,section:sc.value})});S.role='student';login('Profile created successfully. You can now log in.')}catch(e){m.innerHTML=`<div class="msg error">${e.message}</div>`}}}
function adminSetup(){loginShell(`${authHead('Back to portals','ONE-TIME SETUP')}<h2>Create Initial Administrator</h2><p class="muted">This setup disappears after the first Administrator is created.</p><form class="form" id="f"><div class="grid2"><label>First Name<input id="fn" required></label><label>Middle Name<input id="mn"></label><label>Last Name<input id="ln" required></label><label>Username<input id="un" required></label><label class="full">Email<input id="em" type="email" required></label><label>Password<input id="pw" type="password" required></label><label>Confirm Password<input id="cp" type="password" required></label></div><div id="m"></div><button class="primary wide">Create Initial Administrator</button></form>`);back.onclick=portals;f.onsubmit=async e=>{e.preventDefault();if(pw.value!==cp.value)return m.innerHTML='<div class="msg error">Passwords do not match.</div>';try{await api('/auth/setup-admin',{method:'POST',body:JSON.stringify({firstName:fn.value,middleName:mn.value,lastName:ln.value,username:un.value,email:em.value,password:pw.value})});S.role='admin';login('Administrator created successfully.')}catch(e){m.innerHTML=`<div class="msg error">${e.message}</div>`}}}
async function loadMe(){if(!S.token)return false;try{const d=await api('/auth/me');S.user=d.user;return true}catch{clearToken();return false}}
function menu(){if(S.user.role==='student')return ['Dashboard','Apply for ID','My Applications','Notifications'];if(S.user.role==='admin')return ['Dashboard','All Requests','Users','Activity Logs'];return ['Dashboard','Applications']}
function app(){root.innerHTML=`<div class="app"><div class="topbar"><div><h1>Student ID Replacement & Issuance System</h1><small>${S.user.first_name} ${S.user.last_name} · ${roleLabel(S.user.role)}</small></div><button class="outline" id="logout">Logout</button></div><div class="layout"><aside class="side">${menu().map(x=>`<button data-v="${x}" class="${S.view===x?'active':''}">${x}</button>`).join('')}</aside><main class="content" id="content"></main></div></div>`;logout.onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}clearToken();portals()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;app()});renderView()}
async function renderView(){content.innerHTML='<div class="panel">Loading…</div>';if(S.user.role==='student')return studentView();if(S.user.role==='admin')return adminView();return staffView()}
async function studentView(){if(S.view==='Dashboard'){content.innerHTML=`<h2>Student Dashboard</h2><div class="stats"><div class="stat"><span>Student ID</span><b>${S.user.student_id||'-'}</b></div><div class="stat"><span>Program</span><b style="font-size:13px">${S.user.program||'-'}</b></div><div class="stat"><span>Year</span><b>${S.user.year_level||'-'}</b></div><div class="stat"><span>Section</span><b>${S.user.section||'-'}</b></div></div><div class="panel"><h3>Profile</h3><div class="profileGrid"><div><span>Name</span><b>${S.user.first_name} ${S.user.middle_name||''} ${S.user.last_name}</b></div><div><span>Email</span><b>${S.user.email}</b></div><div><span>Contact</span><b>${S.user.contact_number||'-'}</b></div><div><span>Address</span><b>${S.user.address||'-'}</b></div></div></div>`;return}if(S.view==='Apply for ID')return applicationForm();if(S.view==='Notifications'){const d=await api('/notices');content.innerHTML=`<h2>Notifications</h2><div class="panel">${d.notices.length?d.notices.map(n=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${n.title}</b><div class="muted">${n.message}</div></div>`).join(''):'No notifications yet.'}</div>`;return}return requestTable(false)}
function file64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',').pop());r.onerror=rej;r.readAsDataURL(file)})}
function applicationForm(){content.innerHTML=`<h2>Apply for ID Replacement</h2><div class="panel"><form class="form" id="af"><label>Reason<select id="reason"><option>Lost ID</option><option>Damaged ID</option></select></label><label>Description<textarea id="desc" required placeholder="Describe what happened (at least 10 characters)"></textarea></label><label>Supporting Document (PDF/JPG/PNG, max 5MB)<input id="doc" type="file" accept=".pdf,.jpg,.jpeg,.png" required></label><label>ID Photo (JPG/PNG, max 5MB)<input id="photo" type="file" accept="image/jpeg,image/png" required></label><div id="m"></div><button class="primary">Submit Application</button></form></div>`;af.onsubmit=async e=>{e.preventDefault();m.innerHTML='';try{const df=doc.files[0],pf=photo.files[0];if(!df||!pf)throw new Error('Upload both required files.');const du=await api('/files',{method:'POST',body:JSON.stringify({filename:df.name,contentType:df.type,base64:await file64(df),kind:'document'})});const pu=await api('/files',{method:'POST',body:JSON.stringify({filename:pf.name,contentType:pf.type,base64:await file64(pf),kind:'photo'})});const d=await api('/requests',{method:'POST',body:JSON.stringify({reason:reason.value,description:desc.value,document:{...du,kind:'document'},photo:{...pu,kind:'photo'}})});m.innerHTML=`<div class="msg success">Application ${d.request.application_no} submitted successfully.</div>`;af.reset()}catch(e){m.innerHTML=`<div class="msg error">${e.message}</div>`}}}
async function requestTable(staff=true){const d=await api('/requests');const admin=S.user.role==='admin';const showStudent=staff||admin;content.innerHTML=`<div class="sectionHead"><h2>${showStudent?'Applications':'My Applications'}</h2></div><div class="panel" style="overflow:auto"><table class="table"><thead><tr><th>Application</th><th>Student</th><th>Reason</th><th>Status</th><th>Updated</th><th>Documents</th>${staff?'<th>Actions</th>':''}</tr></thead><tbody>${d.requests.length?d.requests.map(r=>`<tr><td><b>${r.application_no}</b></td><td>${r.users?`${r.users.first_name} ${r.users.last_name}<br><small>${r.users.student_id||''}</small>`:'Me'}</td><td>${r.reason}</td><td><span class="badge">${r.status}</span></td><td>${new Date(r.updated_at).toLocaleString()}</td><td><button class="outline" data-docs="${r.id}" data-app="${r.application_no}">View Documents</button></td>${staff?`<td><div class="actions">${actionButtons(r)}</div></td>`:''}</tr>`).join(''):`<tr><td colspan="7">No applications found.</td></tr>`}</tbody></table></div>`;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.id,b.dataset.status));document.querySelectorAll('[data-docs]').forEach(b=>b.onclick=()=>showDocuments(b.dataset.docs,b.dataset.app))}
function actionButtons(r){const role=S.user.role;if(role==='registrar'){if(r.status==='Submitted')return `<button class="outline" data-id="${r.id}" data-status="Under Review">Under Review</button>`;if(['Submitted','Under Review'].includes(r.status))return `<button class="outline" data-id="${r.id}" data-status="Documents Required">Request Docs</button>`;if(['Under Review','Documents Required'].includes(r.status))return `<button class="primary" data-id="${r.id}" data-status="Approved">Approve</button><button class="danger" data-id="${r.id}" data-status="Rejected">Reject</button>`}if(role==='idoffice'){if(r.status==='Approved')return `<button class="primary" data-id="${r.id}" data-status="Processing">Start Processing</button>`;if(r.status==='Processing')return `<button class="primary" data-id="${r.id}" data-status="Ready for Issuance">Mark Ready</button>`;if(r.status==='Ready for Issuance')return `<button class="primary" data-id="${r.id}" data-status="Issued">Mark Issued</button>`}return ''}
async function showDocuments(requestId,appNo){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="docModal"><div class="modalBox"><div class="sectionHead"><div><span class="eyebrow">APPLICATION ${appNo}</span><h2>Uploaded Documents</h2></div><button class="outline" id="closeDocs">Close</button></div><div id="docBody"><div class="panel">Loading documents…</div></div></div></div>`);closeDocs.onclick=()=>docModal.remove();try{const d=await docApi(`?request_id=${encodeURIComponent(requestId)}`);docBody.innerHTML=d.documents.length?`<div class="docList">${d.documents.map(x=>`<div class="docItem"><div class="docTop"><div><div class="docName">${x.kind==='photo'?'ID Photo':'Supporting Document'} — ${x.file_name}</div><div class="docMeta">${x.content_type} · ${(Number(x.size_bytes||0)/1024).toFixed(1)} KB</div><div class="docStatus">${x.verified?'✓ Verified':x.invalid_reason?'⚠ Invalid: '+x.invalid_reason:'Not yet reviewed'}</div></div><div class="actions">${x.view_url?`<button class="outline" data-view="${encodeURIComponent(x.view_url)}">View</button>`:'<span class="muted">Preview unavailable</span>'}${['registrar','admin'].includes(S.user.role)?`<button class="primary" data-verify="${x.id}">Verify</button><button class="danger" data-invalid="${x.id}">Mark Invalid</button>`:''}</div></div></div>`).join('')}</div>`:'<div class="panel">No uploaded documents found.</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>window.open(decodeURIComponent(b.dataset.view),'_blank','noopener'));document.querySelectorAll('[data-verify]').forEach(b=>b.onclick=()=>reviewDocument(b.dataset.verify,true,requestId,appNo));document.querySelectorAll('[data-invalid]').forEach(b=>b.onclick=()=>reviewDocument(b.dataset.invalid,false,requestId,appNo))}catch(e){docBody.innerHTML=`<div class="msg error">${e.message}</div>`}}
async function reviewDocument(id,verified,requestId,appNo){let reason='';if(!verified){reason=prompt('Why is this document invalid?','')||'';if(!reason.trim())return}try{await docApi('',{method:'PUT',body:JSON.stringify({document_id:id,verified,invalid_reason:reason})});docModal.remove();showDocuments(requestId,appNo)}catch(e){alert(e.message)}}
async function changeStatus(id,status){const remarks=prompt(`Remarks for ${status}:`,status)||status;try{await api(`/requests/${id}/status`,{method:'PUT',body:JSON.stringify({status,remarks})});requestTable(true)}catch(e){alert(e.message)}}
async function staffView(){if(S.view==='Dashboard'){const d=await api('/requests');content.innerHTML=`<h2>${roleLabel(S.user.role)} Dashboard</h2><div class="stats"><div class="stat"><span>Total Requests</span><b>${d.requests.length}</b></div><div class="stat"><span>Submitted</span><b>${d.requests.filter(x=>x.status==='Submitted').length}</b></div><div class="stat"><span>Approved</span><b>${d.requests.filter(x=>x.status==='Approved').length}</b></div><div class="stat"><span>Issued</span><b>${d.requests.filter(x=>x.status==='Issued').length}</b></div></div>`;return}return requestTable(true)}
async function adminView(){if(S.view==='Dashboard'){const [r,u]=await Promise.all([api('/requests'),api('/users')]);content.innerHTML=`<h2>Administrator Dashboard</h2><div class="stats"><div class="stat"><span>Users</span><b>${u.users.length}</b></div><div class="stat"><span>Requests</span><b>${r.requests.length}</b></div><div class="stat"><span>Approved</span><b>${r.requests.filter(x=>x.status==='Approved').length}</b></div><div class="stat"><span>Issued</span><b>${r.requests.filter(x=>x.status==='Issued').length}</b></div></div>`;return}if(S.view==='All Requests')return requestTable(false);if(S.view==='Activity Logs'){const d=await api('/activity-logs');content.innerHTML=`<h2>Activity Logs</h2><div class="panel" style="overflow:auto"><table class="table"><tr><th>Date</th><th>Role</th><th>Action</th><th>Description</th></tr>${d.logs.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.role||'-'}</td><td>${x.action}</td><td>${x.description}</td></tr>`).join('')}</table></div>`;return}return usersView()}
async function usersView(){const d=await api('/users');content.innerHTML=`<div class="sectionHead"><h2>User Management</h2><button class="primary" id="add">Add Staff Account</button></div><div class="panel" style="overflow:auto"><table class="table"><tr><th>User</th><th>Role</th><th>Status</th><th>Actions</th></tr>${d.users.map(u=>`<tr><td><b>${u.first_name} ${u.last_name}</b><br><small>${u.username} · ${u.email}</small></td><td>${roleLabel(u.role)}</td><td>${u.active?'Active':'Inactive'}</td><td><div class="actions"><button class="outline" data-reset="${u.id}">Reset Password</button><button class="${u.active?'danger':'outline'}" data-toggle="${u.id}" data-active="${u.active}">${u.active?'Deactivate':'Activate'}</button></div></td></tr>`).join('')}</table></div>`;add.onclick=staffModal;document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetPassword(b.dataset.reset));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleUser(b.dataset.toggle,b.dataset.active==='true'))}
function staffModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="mod"><div class="modalBox"><h2>Add Staff Account</h2><form class="form" id="sf"><div class="grid2"><label>First Name<input id="sfn" required></label><label>Last Name<input id="sln" required></label><label>Username<input id="sun" required></label><label>Email<input id="sem" type="email" required></label><label>Role<select id="srole"><option value="registrar">Registrar</option><option value="idoffice">ID Office</option><option value="admin">Administrator</option></select></label><label>Temporary Password<input id="spw" type="password" required></label></div><div id="sm"></div><div class="actions"><button class="outline" type="button" id="cancel">Cancel</button><button class="primary">Create Staff Account</button></div></form></div></div>`);cancel.onclick=()=>mod.remove();sf.onsubmit=async e=>{e.preventDefault();try{await api('/users/staff',{method:'POST',body:JSON.stringify({firstName:sfn.value,lastName:sln.value,username:sun.value,email:sem.value,role:srole.value,temporaryPassword:spw.value})});mod.remove();usersView()}catch(e){sm.innerHTML=`<div class="msg error">${e.message}</div>`}}}
async function resetPassword(id){const p=prompt('Enter a temporary password:');if(!p)return;try{await api(`/users/${id}/reset-password`,{method:'POST',body:JSON.stringify({temporaryPassword:p})});alert('Temporary password saved.')}catch(e){alert(e.message)}}
async function toggleUser(id,active){try{await api(`/users/${id}`,{method:'PUT',body:JSON.stringify({active:!active})});usersView()}catch(e){alert(e.message)}}
(async()=>{if(await loadMe())app();else portals()})();
</script></body></html>
