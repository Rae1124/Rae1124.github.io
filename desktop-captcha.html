<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Human Verification</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#f4f7fb;color:#172033;display:grid;place-items:center;min-height:100vh}.card{width:min(380px,calc(100% - 28px));background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:24px;box-shadow:0 16px 45px rgba(29,52,84,.1)}h1{font-size:20px;margin:0 0 8px}p{font-size:12px;color:#6d7b8f;line-height:1.55;margin:0 0 18px}.widget{min-height:72px;display:flex;align-items:center}.cancel{margin-top:16px;border:1px solid #cbd9e8;background:#fff;color:#285d96;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;width:100%}
  </style>
</head>
<body>
  <main class="card">
    <h1>Human Verification</h1>
    <p>Complete the security check to continue to your staff account.</p>
    <div id="turnstile" class="widget"></div>
    <button id="cancel" class="cancel" type="button">Cancel</button>
  </main>
  <script>
    const siteKey='0x4AAAAAAFKA_EpytVI2BhzZ';
    function renderChallenge(attempt=0){
      if(window.turnstile&&typeof window.turnstile.render==='function'){
        window.turnstile.render('#turnstile',{sitekey:siteKey,action:'staff_login',appearance:'always',theme:'light',callback(token){window.captchaBridge.complete(token)},'expired-callback'(){},'error-callback'(){}});
        return;
      }
      if(attempt<100)setTimeout(()=>renderChallenge(attempt+1),100);
    }
    document.getElementById('cancel').addEventListener('click',()=>window.captchaBridge.cancel());
    renderChallenge();
  </script>
</body>
</html>
