<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Human Verification</title>
  <style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#f4f7fb;color:#172033;display:grid;place-items:center;min-height:100vh;padding:24px}.card{width:min(360px,100%);background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:24px;box-shadow:0 12px 36px rgba(29,52,84,.1)}h1{font-size:20px;margin:0 0 8px}.muted{font-size:12px;color:#6d7b8f;line-height:1.55;margin:0 0 18px}#widget{min-height:70px}.cancel{width:100%;margin-top:16px;border:1px solid #cbd9e8;background:#fff;color:#285d96;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}#status{font-size:11px;color:#6d7b8f;margin-top:10px;min-height:16px}</style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
</head>
<body>
  <main class="card">
    <h1>Human Verification</h1>
    <p class="muted">Complete the security check to continue signing in to the staff portal.</p>
    <div id="widget"></div><div id="status" aria-live="polite"></div>
    <button class="cancel" id="cancel" type="button">Cancel</button>
  </main>
  <script>
    function renderChallenge(){if(!window.turnstile){setTimeout(renderChallenge,100);return;}turnstile.render('#widget',{sitekey:'0x4AAAAAAFKA_EpytVI2BhzZ',action:'staff_login',appearance:'always',theme:'light',callback(token){document.getElementById('status').textContent='Verification complete.';window.captchaBridge.complete(token);},'expired-callback'(){document.getElementById('status').textContent='Verification expired. Please try again.';},'error-callback'(){document.getElementById('status').textContent='Verification could not be completed. Please try again.';}});}
    document.getElementById('cancel').addEventListener('click',()=>window.captchaBridge.cancel());
    renderChallenge();
  </script>
</body>
</html>
