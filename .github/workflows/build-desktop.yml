name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-electron-build
    paths:
      - 'desktop-source.b64.part-*'
      - 'desktop-captcha.html'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract tested desktop source
        shell: bash
        run: |
          mkdir -p desktop-work
          cat desktop-source.b64.part-00 desktop-source.b64.part-01 desktop-source.b64.part-020 desktop-source.b64.part-021 desktop-source.b64.part-022 desktop-source.b64.part-03 desktop-source.b64.part-04 desktop-source.b64.part-05 | base64 --decode > desktop-source.tar.gz
          tar -xzf desktop-source.tar.gz -C desktop-work

      - name: Install dependencies
        working-directory: desktop-work
        run: npm install --no-audit --no-fund

      - name: Run desktop tests
        working-directory: desktop-work
        run: npm test

      - name: Prepare Windows icon
        working-directory: desktop-work
        run: npm run prepare:icon

      - name: Build installer and portable app
        working-directory: desktop-work
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Verify expected executables
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop-work/dist/Online-Students-ID-Replacement-System-Setup.exe')) { throw 'Installer EXE missing' }
          if (-not (Test-Path 'desktop-work/dist/Online-Students-ID-Replacement-System-Portable.exe')) { throw 'Portable EXE missing' }

      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v4
        with:
          name: online-students-id-replacement-system-windows
          if-no-files-found: error
          path: |
            desktop-work/dist/Online-Students-ID-Replacement-System-Setup.exe
            desktop-work/dist/Online-Students-ID-Replacement-System-Portable.exe
            desktop-work/dist/win-unpacked/**
